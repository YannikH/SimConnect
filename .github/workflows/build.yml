name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore DCSBiosTRC.sln

      - name: Build (Release)
        run: msbuild DCSBiosTRC.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: DCSBiosTRC-Release
          path: bin/Release/
